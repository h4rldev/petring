# Deployment:
# uncomment the entire watchtower section for auto-updates
# uncomment traefik if needed

services:
  petring:
    # image: ghcr.io/h4rldev/petring:latest
    build: . # <- Comment out the image above and uncomment this if you're not pulling the prebuilt image
    container_name: petring
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.scope: petring

    ports: # Unneeded if you're using traefik
      - 8080:8080

    # networks: # For traefik (make sure the name is the same as your traefik network)
    #   - proxy

    volumes:
      - ./data:/app/data

